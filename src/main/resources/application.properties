# ---- HTTP / CORS ----
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${MATCHWIZ_CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

# ---- Datasource ----
# In prod, supply MATCHWIZ_DB_* env vars.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${MATCHWIZ_DB_USER:matchwiz}
%prod.quarkus.datasource.password=${MATCHWIZ_DB_PASSWORD:matchwiz}
%prod.quarkus.datasource.jdbc.url=${MATCHWIZ_DB_URL:jdbc:postgresql://localhost:5432/matchwiz}

# Dev: Quarkus Dev Services auto-manages a PostgreSQL container, pinned to a stable
# port/credentials so it's reachable from a DB client at localhost:5432.
# Connect with: db "matchwiz", user/password "matchwiz" / "matchwiz".
# (%test is intentionally left unset so tests use isolated, ephemeral databases.)
%dev.quarkus.datasource.devservices.port=5432
%dev.quarkus.datasource.devservices.db-name=matchwiz
%dev.quarkus.datasource.devservices.username=matchwiz
%dev.quarkus.datasource.devservices.password=matchwiz
# Reuse the same container (and its data) across dev restarts. Requires
# 'testcontainers.reuse.enable=true' in ~/.testcontainers.properties to take effect.
%dev.quarkus.datasource.devservices.reuse=true

# ---- Hibernate ORM ----
# Flyway owns the schema; Hibernate does not manage it.
quarkus.hibernate-orm.schema-management.strategy=none

# ---- Flyway ----
quarkus.flyway.migrate-at-start=true

# ---- JWT ----
# The committed publicKey.pem / privateKey.pem are DEV-ONLY (so clone + dev + tests
# work out of the box). In production, set these env vars to an absolute path of a
# mounted secret, e.g. MATCHWIZ_JWT_PRIVATE_KEY_LOCATION=/run/secrets/jwt-private.pem
mp.jwt.verify.publickey.location=${MATCHWIZ_JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
mp.jwt.verify.issuer=matchwiz
smallrye.jwt.sign.key.location=${MATCHWIZ_JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
# token lifetime in seconds (24h)
matchwiz.jwt.duration=86400

# ---- Mailer ----
# In prod, supply MATCHWIZ_SMTP_* env vars. Dev/test use the mock mailer
# (mails are logged to stdout and captured in MockMailbox).
quarkus.mailer.from=${MATCHWIZ_SMTP_FROM:no-reply@matchwiz.local}
%prod.quarkus.mailer.host=${MATCHWIZ_SMTP_HOST:localhost}
%prod.quarkus.mailer.port=${MATCHWIZ_SMTP_PORT:587}
%prod.quarkus.mailer.username=${MATCHWIZ_SMTP_USER:}
%prod.quarkus.mailer.password=${MATCHWIZ_SMTP_PASSWORD:}
%prod.quarkus.mailer.start-tls=${MATCHWIZ_SMTP_STARTTLS:REQUIRED}
%prod.quarkus.mailer.tls=${MATCHWIZ_SMTP_TLS:false}
# Escape hatch to run prod without a mail server (mails are only logged).
%prod.quarkus.mailer.mock=${MATCHWIZ_SMTP_MOCK:false}
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true

# ---- Bootstrap admin (idempotent startup seed) ----
matchwiz.admin.username=${MATCHWIZ_ADMIN_USERNAME:admin}
matchwiz.admin.password=${MATCHWIZ_ADMIN_PASSWORD:admin}

# ---- Startup notification ----
# Set MATCHWIZ_NOTIFY_EMAIL to receive an email when the application starts.
# Leave unset (default) to disable — dev/test behaviour is unaffected.
matchwiz.notify.email=${MATCHWIZ_NOTIFY_EMAIL}

# ---- Seeders ----
# World Cup data seeder: disabled by default; enable once per environment to seed reference data.
%dev.matchwiz.seeders.world-cup-2026.enabled=false
%dev.matchwiz.seeders.test-data.enabled=false

# ---- Scheduler ----
# Daily matchday reminder at 08:00 UTC. Override via MATCHWIZ_REMINDER_CRON.
matchwiz.reminder.cron=${MATCHWIZ_REMINDER_CRON:0 0 8 * * ?}
# Disable the scheduler entirely in tests to avoid spurious reminder emails.
%test.quarkus.scheduler.enabled=false
# Disable rate limiting in tests to avoid 429s when many tests call /auth/login.
%test.matchwiz.rate-limit.enabled=false

# ---- OpenAPI ----
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
