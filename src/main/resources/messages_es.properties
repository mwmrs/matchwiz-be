email.group_join_pending.body=Hola {0},\n\nel usuario «{1}» desea unirse al grupo «{2}» y espera tu aprobación.\n\nPor favor, inicia sesión y aprueba o rechaza la solicitud.

notification.membership_approved.title=Membresía aprobada
