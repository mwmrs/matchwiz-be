email.password_reset.subject=MatchWiz código de restablecimiento de contraseña
email.password_reset.body=Hola {0},\n\nse ha solicitado un restablecimiento de contraseña para tu cuenta de MatchWiz "{1}".\n\nTu código de restablecimiento: {2}\n\nEl código es válido durante {3} minutos y puede usarse una vez.\nSi no has solicitado un restablecimiento de contraseña, puedes ignorar este correo.

email.invitation.subject=MatchWiz invitación de grupo
email.invitation.body=Hola,\n\nhas sido invitado/a a unirte al grupo de MatchWiz "{0}".\n\nTu token de invitación: {1}\n\nLa invitación es válida durante {2} días.

notification.user_registration_pending.title=Nuevo registro pendiente
notification.user_registration_pending.message=El usuario «{0}» se ha registrado y espera la aprobación de la cuenta.

email.user_registration_pending.subject=Nuevo registro en MatchWiz: aprobación requerida
email.user_registration_pending.body=Hola {0},\n\nun nuevo usuario se ha registrado en MatchWiz y espera tu aprobación.\n\nNombre de usuario: {1}\nCorreo electrónico: {2}\n\nPor favor, inicia sesión y aprueba o rechaza la cuenta.

