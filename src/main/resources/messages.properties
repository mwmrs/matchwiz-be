email.password_reset.subject=MatchWiz password reset code
email.password_reset.body=Hi {0},\n\na password reset was requested for your MatchWiz account "{1}".\n\nYour reset code: {2}\n\nThe code is valid for {3} minutes and can be used once.\nIf you did not request a password reset, you can ignore this email.

email.verify_email.subject=MatchWiz email verification code
email.verify_email.body=Hi {0},\n\nplease verify your email address for your MatchWiz account "{1}".\n\nYour verification code: {2}\n\nThe code is valid for {3} minutes and can be used once.\nIf you did not request this, you can ignore this email.

email.invitation.subject=MatchWiz group invitation
email.invitation.body=Hi,\n\nyou have been invited to join the MatchWiz group "{0}".\n\nYour invitation token: {1}\n\nThe invitation is valid for {2} days.

notification.user_registration_pending.title=New user registration pending
notification.user_registration_pending.message=User "{0}" has registered and is awaiting account approval.

email.user_registration_pending.subject=New MatchWiz registration: approval required
email.user_registration_pending.body=Hi {0},\n\na new user has registered on MatchWiz and is awaiting your approval.\n\nUsername: {1}\nEmail: {2}\n\nPlease log in and approve or reject the account.

notification.group_join_pending.title=New group join request
notification.group_join_pending.message=User "{0}" has requested to join group "{1}".

email.group_join_pending.subject=New MatchWiz group join request
email.group_join_pending.body=Hi {0},\n\nuser "{1}" has requested to join the group "{2}" and is awaiting approval.\n\nPlease log in to approve or reject the request.

notification.membership_approved.title=Membership approved
notification.membership_approved.message=Your membership in group "{0}" has been approved.

notification.invitation_accepted.title=Invitation accepted
notification.invitation_accepted.message=You joined group "{0}".

email.matchday_reminder.subject=MatchWiz – Missing predictions for upcoming matches
email.matchday_reminder.match_line={0} vs {1} ({2})
email.matchday_reminder.body=Hi {0},\n\nyou have missing predictions for the following upcoming matches:\n\n{1}\n\nPlease log in to MatchWiz to submit your predictions before the matches start.
